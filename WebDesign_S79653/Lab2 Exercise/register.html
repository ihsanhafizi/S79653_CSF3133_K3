    <!-- Event Registration Form -->
     <section id="register">
        <h2>Registration Form</h2>

        <form action="register.html" method="post">
            <label for="fname">Full Name:</label><br>
            <input type="text" id="fname" name="name"><br><br>

            <label for="matricno">Matric Number:</label><br>
            <input type="text" id="matricno" name="matricno"><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label>Year of Study:</label><br>
            <input type="radio" id="year1" name="year" value="Year 1">
            <label for="year1">Year 1</label><br>
            <input type="radio" id="year2" name="year" value="Year 2">
            <label for="year2">Year 2</label><br>
            <input type="radio" id="year3" name="year" value="Year 3">
            <label for="year3">Year 3</label><br>
            <input type="radio" id="year4" name="year" value="Year 4">
            <label for="year4">Year 4</label><br><br>

           <label>Select Your Sessions:</label><br>
            <input type="checkbox" id="session1" name="session1"
            value="Session 1: Introduction to Programming">
            <label for="session1"> Session 1: Introduction to Programming</label><br>
            <input type="checkbox" id="session2" name="session2"
            value="Session 2: Web Development Workshop">
            <label for="session2"> Session 2: Web Development Workshop</label><br>
            <input type="checkbox" id="session3" name="session3"
            value="Session 3: Hands-On Coding">
            <label for="session3"> Session 3: Hands-On Coding</label><br>

            <p>
                <label for="programme">Programme or Faculty:</label>
                <select id="programme" name="programme">
                    <option>Select your course:</option>
                    <option value="se">Software Engineering</option>
                    <option value="mc">Mobile Computing</option>
                    <option value="im">Informatic Maritime</option>
                </select><br>
            </p>
            
            <input type="submit" value="Submit">
        
        </form>
     </section><br><br>
