        <section id="form">
                <h2>Give Your Feedback</h2>
                <form action="submit_feedback.php" method="post">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name"><br><br>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email"><br><br>
                    <label>Overall rating:</label><br>
                    <input type="radio" id="good" name="rating" value="Good">
                    <label for="good">Good</label>
                    <input type="radio" id="average" name="rating" value="Average">
                    <label for="average">Average</label>
                    <input type="radio" id="poor" name="rating" value="Poor">
                    <label for="poor">Poor</label><br><br>
                    <label>Topics I want more practice on:</label>
                    <input type="checkbox" id="html" name="topics" value="HTML">
                    <label for="html">HTML</label><br>
                    <input type="checkbox" id="tables" name="topics" value="Tables and Forms">
                    <label for="tables">Tables and Forms</label><br>
                    <input type="checkbox" id="semantic" name="topics" value="Semantic HTML">
                    <label for="semantic">Semantic HTML</label><br>
                    <input type="checkbox" id="lab" name="lab" value="yes">
                    <label for="lab">I attended all labs</label><br>
                    
                    <p>
                        <label for="group">Group:</label>
                        <select id="group" name="group">
                            <option>Select your group:</option>
                            <option value="k1">K1</option>
                            <option value="k2">K2</option>
                            <option value="k3">K3</option>
                        </select><br>
                    </p>
                    <input type="submit" value="Submit">
                </form>
            </section>
