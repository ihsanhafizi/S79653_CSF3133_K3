<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Div to organize content</title>
</head>
<body>
    <div id="header" style="background-color: lightblue; height: 100px;
    text-align: center;">Header Section</div>
    <div id="nav" style="background-color: lightgreen; height: 50px;
    text-align: center;">Navigation Bar</div>
    <div id="content" style="background-color: lightcoral; width: 400px; height: 350px;
    text-align: center;">Main Content Area</div>
    <div id="sidebar" style="background-color: lightgray; height: 50px;
    text-align: center;">Sidebar Content</div>
    <div id="footer" style="background-color: lightpink; height: 50px;
    text-align: center;">Footer Section</div>
</body>
</html>
