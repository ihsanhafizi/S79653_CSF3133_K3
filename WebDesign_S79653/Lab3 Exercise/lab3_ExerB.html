<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Ticket Booking</title>
    </head>
    <body>

        <!-- Error 1 (Line 1): Missing <!DOCTYPE html> -->
        <!-- Error 2 (Line 9): Incorrect closing position of span in header -->
        <!-- Error 3 (Line 11): Wrong element, use span instead of div -->
        <!-- Error 4 (Line 13): Less than symbol should use &lt; -->
        <!-- Error 5 (Line 13): Missing semicolon in &amp; -->
        <!-- Error 6 (Line 14): Ticket total calculation adds strings instead of numbers -->
        <!-- Error 7 (Line 18): Typo in email input type (emial) -->
        <!-- Error 8 (Line 22): Movie input list attribute uses "movies" instead of "movielist" -->
        <!-- Error 9 (Line 23): Datalist ID should match the movie input list attribute -->
        <!-- Error 10 (Line 32): Reversed rating range min and max values -->
        <!-- Error 11 (Line 33): Incorrect output for attribute (adult kid) -->
        <!-- Error 12 (Line 36): Incorrect copyright entity (&Copy;) -->
        <!-- Error 13 (Line 39): Extra number 54 and duplicate closing HTML tags -->

        <div id="header">
            <h1>e-Ticket <span>Your Campus Cinema</span></h1>
        </div>
        <div id="content">
            <h2>Book Your Ticket</h2>
            <p>Promotion: tickets &lt; RM10 for students &amp; staff!</p>
            <form action="booking.php" oninput="total.value = Number(adult.value) + Number(child.value)">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br><br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"><br><br>
                <label for="date">Show date:</label>
                <input type="date" id="date" name="date"><br><br>
                <label for="movie">Movie:</label>
                <input id="movie" name="movie" list="movielist">
                <datalist id="movielist">
                    <option value="Space Rangers">
                    <option value="Kampung Comedy">
                </datalist><br><br>
                <label for="adult">Adult tickets:</label>
                <input type="number" id="adult" name="adult" value="0"><br><br>
                <label for="child">Child tickets:</label>
                <input type="number" id="child" name="child" value="0"><br><br>
                <label for="rating">Rate our service:</label>
                <input type="range" id="rating" name="rating" min="1" max="5"><br><br>
                Total tickets: <output name="total" for="adult child"></output><br><br>
                <input type="submit" value="Book Now">
            </form>
        </div>
        <div id="footer">
            <p>&copy; 2026 CineKampus. All rights reserved.</p>
        </div>
    </body>
</html>
